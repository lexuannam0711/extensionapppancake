name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  UPDATE_ALLOWED_HOSTS: github.com,objects.githubusercontent.com

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and package versions
        run: node scripts/validate-release-version.js --tag ${GITHUB_REF_NAME}

  modern:
    needs: validate-release
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify protected tag checkout
        shell: pwsh
        run: |
          if ((git status --porcelain).Length -ne 0) { throw 'Release checkout is dirty.' }
          $tagCommit = git rev-list -n 1 $env:GITHUB_REF_NAME
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw 'Tag does not point at checked-out commit.' }
      - run: npm ci
      - name: Verify npm install did not modify checkout
        shell: pwsh
        run: if ((git status --porcelain).Length -ne 0) { throw 'npm ci modified release checkout.' }
      - name: Set release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          npm version --no-git-tag-version $version
      - name: Prepare pinned updater public key
        shell: pwsh
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-release-key.js --output src/update/trusted-public-key.pem
      - run: npm run check
      - run: npm test
      - run: node scripts/audit-artifact.js src
      - name: Prepare Authenticode certificate
        shell: pwsh
        env:
          WIN_CERTIFICATE_BASE64: ${{ secrets.WIN_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:WIN_CERTIFICATE_BASE64) { throw 'WIN_CERTIFICATE_BASE64 is required for release.' }
          $path = Join-Path $env:RUNNER_TEMP 'codesign.p12'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WIN_CERTIFICATE_BASE64))
          "CSC_LINK=$path" >> $env:GITHUB_ENV
      - name: Build NSIS installer
        env:
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: npm run build:modern
      - name: Audit generated modern payload
        run: node scripts/audit-artifact.js dist/win-unpacked
      - name: Verify modern Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstaller' } | Select-Object -First 1
          if (-not $installer) { throw 'Modern installer not found.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature is $($signature.Status)." }
      - name: Create signed modern manifest
        shell: pwsh
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          $artifact = Get-ChildItem dist -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstaller' } | Select-Object -First 1
          if (-not $artifact) { throw 'Modern installer not found.' }
          node scripts/create-release-manifest.js --artifact $artifact.FullName --version $env:GITHUB_REF_NAME --channel modern --min-supported-version 3.0.0 --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($artifact.Name)" --output dist/manifest-modern.json
      - name: Stage modern release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem dist -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstaller' } | Select-Object -First 1
          Copy-Item $installer.FullName release-assets
          Copy-Item dist/manifest-modern.json release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: modern-release
          path: release-assets/*
          if-no-files-found: error

  win7:
    needs: validate-release
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify protected tag checkout
        shell: pwsh
        run: |
          if ((git status --porcelain).Length -ne 0) { throw 'Release checkout is dirty.' }
          $tagCommit = git rev-list -n 1 $env:GITHUB_REF_NAME
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw 'Tag does not point at checked-out commit.' }
      - run: npm ci
      - name: Verify npm install did not modify checkout
        shell: pwsh
        run: if ((git status --porcelain).Length -ne 0) { throw 'npm ci modified release checkout.' }
      - name: Set Win7 release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          npm version --no-git-tag-version $version
          foreach ($file in @('package.win7.json', 'package.win7-lock.json')) {
            $json = Get-Content -Raw -LiteralPath $file | ConvertFrom-Json
            $json.version = $version
            $rootPackage = $json.packages.PSObject.Properties | Where-Object { $_.Name -eq '' }
            if ($rootPackage) { $rootPackage.Value.version = $version }
            $json | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $file -Encoding utf8
          }
      - run: node scripts/audit-artifact.js src
      - name: Prepare pinned updater public key
        shell: pwsh
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-release-key.js --output src/update/trusted-public-key.pem
      - run: node scripts/audit-artifact.js src
      - name: Build Win7 portable ZIP
        run: npm run build:win7
      - name: Audit generated Win7 payload
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter '*-Win7-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Win7 ZIP not found.' }
          $temp = Join-Path $env:RUNNER_TEMP 'win7-audit'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $temp -Force
          node scripts/audit-artifact.js $temp
      - name: Create signed Win7 manifest
        shell: pwsh
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          $artifact = Get-ChildItem dist -Filter '*-Win7-x64.zip' | Select-Object -First 1
          if (-not $artifact) { throw 'Win7 ZIP not found.' }
          node scripts/create-release-manifest.js --artifact $artifact.FullName --version $env:GITHUB_REF_NAME --channel win7 --min-supported-version 3.0.0 --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($artifact.Name)" --output dist/manifest-win7.json
      - name: Stage Win7 release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $artifact = Get-ChildItem dist -Filter '*-Win7-x64.zip' | Select-Object -First 1
          Copy-Item $artifact.FullName release-assets
          Copy-Item dist/manifest-win7.json release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: win7-release
          path: release-assets/*
          if-no-files-found: error

  draft-release:
    needs: [modern, win7]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release-files/**/*
